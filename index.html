<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Assistant</title>
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px;
        }

        h1 {
            color: #80d8ff;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        video, img {
            width: 100%;
            max-width: 640px;
            border-radius: 15px;
            border: 2px solid #80d8ff;
            background: #000;
        }

        .panel {
            background: #1e293b;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #voiceButton {
            background: #38bdf8;
            color: #101827;
        }

        #stopButton {
            background: #d9534f;
            color: white;
        }

        #objects {
            font-size: 18px;
            line-height: 1.8;
        }

        .status {
            color: #a7f3d0;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Visual Assistant</h1>
    <p>AI-powered browser camera feed and voice feedback</p>

    <!-- Live browser camera feed -->
    <video id="webcam" autoplay playsinline muted></video>

    <div class="panel">
        <h2>System Status</h2>
        <div id="objects">Click 'Start Camera' to initialize feed...</div>
    </div>

    <div class="panel">
        <h2>Voice Assistant</h2>
        <p id="voiceStatus" class="status">Voice announcements are off.</p>
        
        <button id="voiceButton" onclick="enableVoice()">Enable Voice Announcements</button>
        <button id="stopButton" onclick="stopVoice()">Stop Speaking</button>
        <button onclick="startCamera()" style="background: #269b55; color: white;">Start Camera</button>
    </div>

</div>

<script>
    let voiceEnabled = false;
    const videoElement = document.getElementById("webcam");

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
            videoElement.srcObject = stream;
            document.getElementById("objects").innerText = "Camera active. Monitoring stream...";
            speak("Camera initialized successfully.");
        } catch (error) {
            console.error("Camera access denied:", error);
            document.getElementById("objects").innerText = "Error: Could not access webcam.";
        }
    }

    function enableVoice() {
        voiceEnabled = true;
        document.getElementById("voiceStatusinnerText" = "Voice announcements are on.");
        document.getElementById("voiceStatus").innerText = "Voice announcements are on.";
        speak("Voice announcements enabled.");
    }

    function stopVoice() {
        voiceEnabled = false;
        window.speechSynthesis.cancel();
        document.getElementById("voiceStatus").innerText = "Voice announcements are off.";
    }

    function speak(message) {
        if (!voiceEnabled) return;
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(message);
        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
