<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual Assistant - Object Detection</title>
    <!-- TensorFlow.js and COCO-SSD object detection model -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
    <a href="https://emilyh-d.github.io/ai-for-humanity/" class="btn-link">Home</a>
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px;
        }

        h1 {
            color: #80d8ff;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        #videoContainer {
            position: relative;
            display: inline-block;
            max-width: 100%;
        }

        video {
            width: 100%;
            max-width: 640px;
            border-radius: 15px;
            border: 2px solid #80d8ff;
            background: #000;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .panel {
            background: #1e293b;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #startButton {
            background: #269b55;
            color: white;
        }

        #voiceButton {
            background: #38bdf8;
            color: #101827;
        }

        #stopButton {
            background: #d9534f;
            color: white;
        }

        #statusBox {
            font-size: 18px;
            line-height: 1.8;
            color: #a7f3d0;
            text-align: left;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Visual Assistant</h1>
    <p>Real-time browser object detection and speech feedback</p>

    <div id="videoContainer">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div class="panel">
        <h2>Detected Objects in View</h2>
        <div id="statusBox">Click 'Start Camera' to initialize feed and AI model...</div>
    </div>

    <div class="panel">
        <h2>Voice Assistant</h2>
        <p id="voiceStatus">Voice announcements are off.</p>
        
        <button id="startButton" onclick="startCamera()">Start Camera</button>
        <button id="voiceButton" onclick="enableVoice()">Enable Voice</button>
        <button id="stopButton" onclick="stopVoice()">Stop Speaking</button>
    </div>

</div>

<script>
    let voiceEnabled = false;
    let model = null;
    let isDetecting = false;
    const video = document.getElementById("webcam");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusBox = document.getElementById("statusBox");

    let lastSpokenTime = {};

    async function startCamera() {
        document.getElementById("startButton").disabled = true;
        statusBox.innerText = "Requesting camera access...";
        
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            video.srcObject = stream;
            
            await new Promise(resolve => { video.onloadedmetadata = resolve; });
            await video.play();

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            statusBox.innerText = "Loading COCO-SSD object detection model...";
            
            await tf.ready();
            model = await cocoSsd.load();
            
            statusBox.innerText = "Camera and AI model active! Scanning view...";
            speak("Camera and object detection active.");
            
            isDetecting = true;
            detectFrame();

        } catch (error) {
            console.error("Initialization error:", error);
            statusBox.innerText = "Error: Could not access camera or load model. Check permissions.";
            document.getElementById("startButton").disabled = false;
        }
    }

    async function detectFrame() {
        if (!isDetecting || !model) return;

        const predictions = await model.detect(video);
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (predictions.length === 0) {
            statusBox.innerText = "Looking for objects...";
        } else {
            let htmlList = "<ul>";

            predictions.forEach(prediction => {
                const [x, y, width, height] = prediction.bbox;
                const label = prediction.class;
                // Fixed: using prediction.score to prevent NaN
                const score = Math.round((prediction.score || 0) * 100);

                // Draw bounding box
                ctx.strokeStyle = "#00FF00";
                ctx.lineWidth = 3;
                ctx.strokeRect(x, y, width, height);

                // Draw label background
                ctx.fillStyle = "#00FF00";
                ctx.fillRect(x, y > 20 ? y - 20 : 0, width, 20);

                // Draw text inside label
                ctx.fillStyle = "#000000";
                ctx.font = "16px Arial";
                ctx.fillText(`${label} (${score}%)`, x + 5, y > 20 ? y - 5 : 15);

                htmlList += `<li><strong>${label}</strong> — ${score}% certainty</li>`;
            });
            htmlList += "</ul>";
            statusBox.innerHTML = htmlList;

            // Announce detected items periodically if voice is enabled
            if (voiceEnabled && predictions.length > 0) {
                const now = Date.now();
                const primaryObject = predictions[0].class;
                if (!lastSpokenTime[primaryObject] || now - lastSpokenTime[primaryObject] > 7000) {
                    speak("I see a " + primaryObject);
                    lastSpokenTime[primaryObject] = now;
                }
            }
        }

        if (isDetecting) {
            requestAnimationFrame(detectFrame);
        }
    }

    function enableVoice() {
        voiceEnabled = true;
        document.getElementById("voiceStatus").innerText = "Voice announcements are on.";
        speak("Voice announcements enabled.");
    }

    function stopVoice() {
        voiceEnabled = false;
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById("voiceStatus").innerText = "Voice announcements are off.";
    }

    function speak(message) {
        if (!voiceEnabled || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(message);
        speech.rate = 1;
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
