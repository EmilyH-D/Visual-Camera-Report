<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Visual Assistant</title>
    <a href="https://emilyh-d.github.io/ai-for-humanity/" class="btn-link">Home</a>
    <style>
        body {
            background: #101827;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px;
        }

        h1 {
            color: #80d8ff;
        }

        .container {
            max-width: 850px;
            margin: auto;
        }

        video {
            width: 100%;
            max-width: 640px;
            border-radius: 15px;
            border: 2px solid #80d8ff;
            background: #000;
        }

        .panel {
            background: #1e293b;
            padding: 20px;
            margin-top: 20px;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        #startButton {
            background: #269b55;
            color: white;
        }

        #voiceButton {
            background: #38bdf8;
            color: #101827;
        }

        #stopButton {
            background: #d9534f;
            color: white;
        }

        #statusBox {
            font-size: 18px;
            line-height: 1.8;
            color: #a7f3d0;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Visual Assistant</h1>
    <p>AI-powered browser camera feed and speech synthesis</p>

    <!-- Live device camera stream -->
    <video id="webcam" autoplay playsinline muted></video>

    <div class="panel">
        <h2>System Status</h2>
        <div id="statusBox">Click 'Start Camera' to initialize feed...</div>
    </div>

    <div class="panel">
        <h2>Voice Assistant</h2>
        <p id="voiceStatus">Voice announcements are off.</p>
        
        <button id="startButton" onclick="startCamera()">Start Camera</button>
        <button id="voiceButton" onclick="enableVoice()">Enable Voice</button>
        <button id="stopButton" onclick="stopVoice()">Stop Speaking</button>
    </div>

</div>

<script>
    let voiceEnabled = false;
    const videoElement = document.getElementById("webcam");
    const statusBox = document.getElementById("statusBox");

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user" }, 
                audio: false 
            });
            videoElement.srcObject = stream;
            statusBox.innerText = "Camera active. Stream initialized successfully.";
            speak("Camera initialized successfully.");
        } catch (error) {
            console.error("Camera access error:", error);
            statusBox.innerText = "Error: Could not access device webcam. Check permissions.";
        }
    }

    function enableVoice() {
        voiceEnabled = true;
        document.getElementById("voiceStatus").innerText = "Voice announcements are on.";
        speak("Voice announcements enabled.");
    }

    function stopVoice() {
        voiceEnabled = false;
        if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
        }
        document.getElementById("voiceStatus").innerText = "Voice announcements are off.";
    }

    function speak(message) {
        if (!voiceEnabled || !("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const speech = new SpeechSynthesisUtterance(message);
        speech.rate = 1;
        speech.pitch = 1;
        speech.volume = 1;
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
